<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="origin">
<title>여행 가이드 모음</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f26; --sub:#6b7280; --line:#e5e7eb; --accent:#2563eb;
          --food:#f97316; --hotel:#2563eb; --spot:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12141a; --card:#1c1f27; --text:#f1f2f4; --sub:#9aa1ad; --line:#2c303a; --accent:#6ea0ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; line-height:1.5; }
  .wrap { max-width:640px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .desc { color:var(--sub); margin:0 0 20px; font-size:14px; }
  .crumb { font-size:14px; color:var(--sub); margin-bottom:12px; }
  .crumb a { color:var(--accent); text-decoration:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 12px;
          text-align:center; text-decoration:none; color:var(--text); font-weight:600; }
  .tile .e { font-size:30px; display:block; margin-bottom:6px; }
  .tile small { display:block; color:var(--sub); font-weight:400; margin-top:2px; }
  .tile:active { transform:scale(.98); }
  #map { height:320px; border-radius:14px; border:1px solid var(--line); margin:8px 0 24px; z-index:0; }
  .legend { display:flex; gap:12px; font-size:13px; color:var(--sub); margin:-12px 0 20px; flex-wrap:wrap; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  h2 { font-size:17px; margin:24px 0 8px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .list a { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:14px 16px;
            color:var(--text); text-decoration:none; border-top:1px solid var(--line); }
  .list a:first-child { border-top:0; }
  .list a::after { content:"›"; color:var(--sub); font-size:20px; }
  .empty { color:var(--sub); font-size:14px; padding:14px 16px; background:var(--card);
           border:1px dashed var(--line); border-radius:14px; }
  .pin { width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
         border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const D = window.DATA;
const app = document.getElementById('app');
const SECTIONS = [
  { key:'info',  title:'💡 유용한 정보', color:null },
  { key:'food',  title:'🍜 맛집',       color:'var(--food)',  hex:'#f97316' },
  { key:'hotel', title:'🏨 추천 호텔',   color:'var(--hotel)', hex:'#2563eb' },
  { key:'spot',  title:'🎡 추천 관광지', color:'var(--spot)',  hex:'#16a34a' },
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let map = null;

function header(crumbs) {
  const parts = crumbs.map(c => c.href ? `<a href="${c.href}">${esc(c.label)}</a>` : esc(c.label));
  return `<div class="crumb">${parts.join(' › ')}</div>`;
}

function render() {
  if (map) { map.remove(); map = null; }
  const path = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  const [rid, cid, cityId] = path;
  const region = D.regions.find(r => r.id === rid);
  const country = region && region.countries.find(c => c.id === cid);

  if (cityId && country && D.cities[cityId]) return renderCity(region, country, cityId);
  if (country) return renderCountry(region, country);
  if (region) return renderRegion(region);
  renderHome();
}

function tiles(items) {
  return `<div class="grid">${items.map(i =>
    `<a class="tile" href="${i.href}"><span class="e">${i.emoji||'📍'}</span>${esc(i.name)}${i.sub?`<small>${esc(i.sub)}</small>`:''}</a>`).join('')}</div>`;
}

function renderHome() {
  document.title = D.siteTitle;
  app.innerHTML = `<h1>${esc(D.siteTitle)}</h1><p class="desc">${esc(D.siteDesc)}</p>` +
    tiles(D.regions.map(r => ({ name:r.name, emoji:r.emoji, href:`#/${r.id}`, sub:`${r.countries.length}개 나라` })));
}
function renderRegion(region) {
  document.title = region.name;
  app.innerHTML = header([{label:'홈', href:'#/'}, {label:region.name}]) + `<h1>${esc(region.name)}</h1><p class="desc">나라를 선택하세요</p>` +
    tiles(region.countries.map(c => ({ name:c.name, emoji:c.emoji, href:`#/${region.id}/${c.id}` })));
}
function renderCountry(region, country) {
  document.title = country.name;
  app.innerHTML = header([{label:'홈', href:'#/'}, {label:region.name, href:`#/${region.id}`}, {label:country.name}]) +
    `<h1>${esc(country.name)}</h1><p class="desc">도시를 선택하세요</p>` +
    tiles(country.cities.map(id => ({ name:D.cities[id].name, emoji:'🏙️', href:`#/${region.id}/${country.id}/${id}` })));
}

function renderCity(region, country, id) {
  const city = D.cities[id];
  document.title = `${city.name} 여행 가이드`;
  const pinned = SECTIONS.filter(s => s.color).flatMap(s => (city[s.key]||[]).filter(i => i.lat != null).map(i => ({...i, sec:s})));

  let html = header([{label:'홈', href:'#/'}, {label:region.name, href:`#/${region.id}`},
                     {label:country.name, href:`#/${region.id}/${country.id}`}, {label:city.name}]);
  html += `<h1>${esc(city.name)}</h1>`;
  html += `<div id="map"></div><div class="legend">` +
    SECTIONS.filter(s=>s.color).map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.title.slice(2)}</span>`).join('') + `</div>`;
  for (const s of SECTIONS) {
    const items = city[s.key] || [];
    html += `<h2>${s.title}</h2>`;
    html += items.length
      ? `<div class="list">${items.map(i => `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`).join('')}</div>`
      : `<div class="empty">준비 중이에요</div>`;
  }
  app.innerHTML = html;

  map = L.map('map', { scrollWheelZoom:false }).setView(city.center, city.zoom || 12);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom:19,
      attribution:'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, OpenStreetMap contributors' }).addTo(map);
  const touch = matchMedia('(hover: none)').matches;
  pinned.forEach(p => {
    const icon = L.divIcon({ className:'', iconSize:[26,26], iconAnchor:[13,26],
      html:`<div class="pin" style="background:${p.sec.hex}"></div>` });
    const m = L.marker([p.lat, p.lng], { icon }).addTo(map);
    if (touch) {   // 모바일: 탭하면 이름+열기 버튼
      m.bindPopup(`<b>${esc(p.title)}</b><br><a href="${esc(p.url)}" target="_blank" rel="noopener">링크 열기 ›</a>`);
    } else {       // PC: 이름 툴팁, 클릭하면 바로 링크 열림
      m.bindTooltip(p.title);
      m.on('click', () => window.open(p.url, '_blank', 'noopener'));
    }
  });
  if (pinned.length > 1) map.fitBounds(pinned.map(p => [p.lat, p.lng]), { padding:[40,40], maxZoom:14 });
}

addEventListener('hashchange', () => { render(); scrollTo(0,0); });
render();
</script>
</body>
</html>
